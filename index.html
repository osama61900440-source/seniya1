/* PIN Lock Screen & Keypad (Modern Native Mobile Style) */
.lock-screen {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: radial-gradient(circle at 50% 18%, #1e293b 0%, #0f172a 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  padding: 30px 24px 24px;
  overflow-y: auto;
  user-select: none;
  -webkit-user-select: none;
}
.lock-screen.shake {
  animation: lockShake 0.38s ease-in-out;
}
@keyframes lockShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-9px); }
  40%, 80% { transform: translateX(9px); }
}
.lock-icon-badge {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  border: 1.5px solid rgba(255, 255, 255, 0.16);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin-bottom: 12px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
}
.lock-title {
  font-size: 18px;
  font-weight: 800;
  color: #f8fafc;
  letter-spacing: -0.2px;
  margin-bottom: 4px;
}
.lock-subtitle {
